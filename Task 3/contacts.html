<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolodex — DecodeLabs Contact Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-base: #eaf6fc;
    --sky-mid: #d8eef9;
    --white: #ffffff;
    --cyan: #0ea5c4;
    --cyan-deep: #0b87a1;
    --coral: #ff6b5e;
    --coral-deep: #e85647;
    --ink: #1b3a4b;
    --slate: #6b8a99;
    --line: #d3e8f2;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 56px) 16px 60px;
    position: relative;
    background: var(--sky-base);
  }

  .sky-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .sky-bg::before, .sky-bg::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.75;
  }
  .sky-bg::before {
    width: 680px; height: 680px;
    background: radial-gradient(circle, #8fd8f0 0%, transparent 70%);
    top: -240px; left: -180px;
    animation: driftA 22s ease-in-out infinite;
  }
  .sky-bg::after {
    width: 560px; height: 560px;
    background: radial-gradient(circle, #ffc9b8 0%, transparent 70%);
    bottom: -220px; right: -150px;
    animation: driftB 26s ease-in-out infinite;
  }
  .sky-bg > .orb3 {
    position: absolute;
    width: 460px; height: 460px;
    border-radius: 50%;
    filter: blur(75px);
    opacity: 0.6;
    background: radial-gradient(circle, #c9b8ff 0%, transparent 70%);
    top: 40%; left: 50%;
    animation: driftC 30s ease-in-out infinite;
  }
  @keyframes driftC {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-45%, -55%) scale(1.15); }
  }
  @keyframes driftA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.08); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-50px, -30px) scale(1.1); }
  }

  ::selection { background: var(--cyan); color: var(--white); }

  .wrap { width: 100%; max-width: 900px; position: relative; z-index: 1; }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: clamp(24px, 4vw, 34px);
    flex-wrap: wrap;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.65);
    border-radius: var(--radius-lg);
    padding: clamp(16px, 3vw, 22px) clamp(18px, 3vw, 26px);
    box-shadow: 0 10px 30px rgba(27,58,75,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
  }

  .brand-eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--coral-deep);
    margin-bottom: 8px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 6vw, 42px);
    margin: 0;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  h1 .accent { color: var(--cyan-deep); }

  .sub { font-size: 13.5px; color: var(--slate); margin-top: 6px; font-weight: 500; }

  .status-pill {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 100px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(14,165,196,0.14), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .status-dot.off { background: var(--coral); box-shadow: 0 0 8px var(--coral); }

  .panel {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: var(--radius-lg);
    padding: clamp(18px, 3vw, 26px);
    box-shadow: 0 18px 40px rgba(27,58,75,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
    margin-bottom: 30px;
  }

  .panel-title {
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); flex-shrink: 0; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-grid .full { grid-column: 1 / -1; }

  label {
    display: block;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 7px;
    font-weight: 600;
  }
  label .req { color: var(--coral-deep); }

  input[type="text"], input[type="email"], input[type="tel"], textarea {
    width: 100%;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,0.8);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  textarea { resize: vertical; min-height: 64px; font-family: 'Inter', sans-serif; }
  input::placeholder, textarea::placeholder { color: #7fa0af; }
  input:focus, textarea:focus {
    border-color: var(--cyan);
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 0 4px rgba(14,165,196,0.14);
  }

  .panel-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 12px;
  }

  .error-msg { color: var(--coral-deep); font-size: 12.5px; font-weight: 600; flex: 1; }

  button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; border-radius: var(--radius-md); }

  .btn-add {
    background: linear-gradient(135deg, var(--coral), var(--coral-deep));
    color: var(--white);
    font-weight: 700;
    font-size: 14.5px;
    padding: 13px 28px;
    box-shadow: 0 8px 18px rgba(255,107,94,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }
  .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,107,94,0.42); }
  .btn-add:active { transform: translateY(0); }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .list-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--slate);
    margin: 4px 4px 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: var(--radius-lg);
    padding: 20px;
    position: relative;
    transition: border-color 0.25s, opacity 0.3s, transform 0.25s, box-shadow 0.25s, background 0.25s;
    box-shadow: 0 8px 24px rgba(27,58,75,0.07), inset 0 1px 0 rgba(255,255,255,0.75);
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(14,165,196,0.2), inset 0 1px 0 rgba(255,255,255,0.9);
    border-color: rgba(14,165,196,0.5);
    background: rgba(255,255,255,0.68);
  }
  .card.removing { opacity: 0; transform: scale(0.96); }
  .card.entering { animation: cardIn 0.35s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-8px);} to { opacity: 1; transform: translateY(0);} }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: linear-gradient(140deg, var(--cyan), var(--cyan-deep));
    color: var(--white);
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 6px 14px rgba(14,165,196,0.35);
  }

  .card-name {
    font-family: 'Sora', sans-serif;
    font-size: 17px;
    font-weight: 700;
    flex: 1;
    min-width: 0;
    word-break: break-word;
    padding-top: 6px;
    color: var(--ink);
  }

  .card-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--sky-base);
    color: var(--slate);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .icon-btn:hover { background: var(--cyan); color: var(--white); }
  .icon-btn.delete:hover { background: var(--coral); color: var(--white); }
  .icon-btn svg { width: 15px; height: 15px; }

  .card-detail {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
    color: var(--slate);
    padding: 5px 0;
    word-break: break-word;
    font-weight: 500;
  }
  .card-detail svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--cyan); }

  .card-notes {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 13.5px;
    color: var(--ink);
    opacity: 0.75;
    line-height: 1.55;
  }

  .edit-field {
    width: 100%;
    background: var(--sky-base);
    border: 1.5px solid var(--cyan);
    color: var(--ink);
    font-size: 13.5px;
    padding: 8px 11px;
    border-radius: var(--radius-sm);
    outline: none;
    margin-bottom: 7px;
    font-family: 'Inter', sans-serif;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--slate);
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: var(--radius-lg);
    border: 1px dashed rgba(255,255,255,0.8);
  }
  .empty-state .glyph { font-family: 'Sora', sans-serif; font-size: 34px; color: var(--cyan); opacity: 0.6; margin-bottom: 10px; font-weight: 700; }
  .empty-state p { margin: 0; font-size: 13.5px; font-weight: 500; }

  footer { text-align: center; margin-top: 40px; font-size: 11.5px; color: #9fb8c4; letter-spacing: 0.04em; font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .sky-bg::before, .sky-bg::after { animation: none !important; }
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--cyan-deep); outline-offset: 2px;
  }

  /* Themed scrollbar */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--sky-base); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--cyan), var(--cyan-deep));
    border-radius: 100px;
    border: 3px solid var(--sky-base);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, var(--coral), var(--coral-deep));
  }
  * { scrollbar-width: thin; scrollbar-color: var(--cyan) var(--sky-base); }
</style>
</head>
<body>
<div class="sky-bg"><div class="orb3"></div></div>
<div class="wrap">

  <header class="top">
    <div>
      <div class="brand-eyebrow">DecodeLabs — Project 3</div>
      <h1>Rolo<span class="accent">dex</span></h1>
      <div class="sub">A contact book, backed by MySQL</div>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </header>

  <div class="panel">
    <p class="panel-title"><span class="dot"></span>Add a contact</p>
    <div class="form-grid">
      <div>
        <label>Name <span class="req">*</span></label>
        <input type="text" id="fName" placeholder="Jane Whitfield" maxlength="100" />
      </div>
      <div>
        <label>Email <span class="req">*</span></label>
        <input type="email" id="fEmail" placeholder="jane@example.com" maxlength="150" />
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" id="fPhone" placeholder="+1 555 000 1234" maxlength="20" />
      </div>
      <div class="full">
        <label>Notes</label>
        <textarea id="fNotes" placeholder="How you know them, reminders, etc." maxlength="500"></textarea>
      </div>
    </div>
    <div class="panel-footer">
      <div class="error-msg" id="errorMsg"></div>
      <button class="btn-add" id="addBtn">Add contact</button>
    </div>
  </div>

  <div class="list-label">
    <span>Contacts</span>
    <span id="countLabel">—</span>
  </div>

  <div class="grid" id="cardsGrid"></div>

  <footer>Backed by a PHP + MySQL API · GET / POST / PUT / DELETE</footer>
</div>

<script>
const API_URL = 'contacts_api.php';

const cardsGrid = document.getElementById('cardsGrid');
const fName = document.getElementById('fName');
const fEmail = document.getElementById('fEmail');
const fPhone = document.getElementById('fPhone');
const fNotes = document.getElementById('fNotes');
const addBtn = document.getElementById('addBtn');
const errorMsg = document.getElementById('errorMsg');
const countLabel = document.getElementById('countLabel');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

function setConnectionStatus(ok) {
  statusDot.classList.toggle('off', !ok);
  statusText.textContent = ok ? 'API connected' : 'API offline';
}
function showError(msg) { errorMsg.textContent = msg || ''; }
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function initials(name) {
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
}

const mailIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6l-10 7L2 6"></path><path d="M2 6h20v12H2z"></path></svg>`;
const phoneIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>`;
const editIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
const trashIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>`;

function renderContacts(contacts) {
  cardsGrid.innerHTML = '';
  countLabel.textContent = contacts.length + (contacts.length === 1 ? ' contact' : ' contacts');

  if (contacts.length === 0) {
    cardsGrid.innerHTML = `<div class="empty-state"><div class="glyph">—</div><p>No contacts yet. Add your first one above.</p></div>`;
    return;
  }

  contacts.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card entering';
    card.dataset.id = c.id;
    card.innerHTML = `
      <div class="card-top">
        <div class="avatar">${initials(c.name)}</div>
        <div class="card-name">${escapeHtml(c.name)}</div>
        <div class="card-actions">
          <button class="icon-btn edit" title="Edit">${editIcon}</button>
          <button class="icon-btn delete" title="Delete">${trashIcon}</button>
        </div>
      </div>
      <div class="card-detail">${mailIcon}<span>${escapeHtml(c.email)}</span></div>
      ${c.phone ? `<div class="card-detail">${phoneIcon}<span>${escapeHtml(c.phone)}</span></div>` : ''}
      ${c.notes ? `<div class="card-notes">${escapeHtml(c.notes)}</div>` : ''}
    `;
    card.querySelector('.edit').addEventListener('click', () => startEdit(card, c));
    card.querySelector('.delete').addEventListener('click', () => deleteContact(card, c.id));
    cardsGrid.appendChild(card);
  });
}

async function loadContacts() {
  try {
    const res = await fetch(`${API_URL}?action=list`);
    if (!res.ok) throw new Error();
    const contacts = await res.json();
    setConnectionStatus(true);
    renderContacts(contacts);
  } catch (err) {
    setConnectionStatus(false);
    cardsGrid.innerHTML = `<div class="empty-state"><div class="glyph">!</div><p>Can't reach the API. Check contacts_api.php is uploaded and reachable.</p></div>`;
  }
}

async function addContact() {
  const name = fName.value.trim();
  const email = fEmail.value.trim();
  const phone = fPhone.value.trim();
  const notes = fNotes.value.trim();
  showError('');

  if (!name || !email) {
    showError('Name and email are required.');
    return;
  }

  addBtn.disabled = true;
  try {
    const res = await fetch(`${API_URL}?action=create`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone, notes })
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || 'Something went wrong.');
      return;
    }
    fName.value = ''; fEmail.value = ''; fPhone.value = ''; fNotes.value = '';
    await loadContacts();
  } catch (err) {
    showError('Could not reach the API.');
  } finally {
    addBtn.disabled = false;
  }
}

function startEdit(card, c) {
  card.innerHTML = `
    <input class="edit-field" id="eName" value="${escapeHtml(c.name)}" placeholder="Name" />
    <input class="edit-field" id="eEmail" value="${escapeHtml(c.email)}" placeholder="Email" />
    <input class="edit-field" id="ePhone" value="${escapeHtml(c.phone || '')}" placeholder="Phone" />
    <textarea class="edit-field" id="eNotes" placeholder="Notes">${escapeHtml(c.notes || '')}</textarea>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="btn-add" id="eSave" style="padding:9px 18px; font-size:13px;">Save</button>
      <button class="icon-btn" id="eCancel" title="Cancel">✕</button>
    </div>
  `;
  card.querySelector('#eSave').addEventListener('click', async () => {
    const name = card.querySelector('#eName').value.trim();
    const email = card.querySelector('#eEmail').value.trim();
    const phone = card.querySelector('#ePhone').value.trim();
    const notes = card.querySelector('#eNotes').value.trim();
    if (!name || !email) { showError('Name and email are required.'); return; }
    try {
      const res = await fetch(`${API_URL}?action=update&id=${c.id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, notes })
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error || 'Could not update.'); return; }
      showError('');
      loadContacts();
    } catch (err) { showError('Could not reach the API.'); }
  });
  card.querySelector('#eCancel').addEventListener('click', loadContacts);
}

async function deleteContact(card, id) {
  card.classList.add('removing');
  try {
    const res = await fetch(`${API_URL}?action=delete&id=${id}`, { method: 'POST' });
    if (!res.ok) throw new Error();
    setTimeout(loadContacts, 250);
  } catch (err) {
    showError('Could not delete contact.');
    card.classList.remove('removing');
  }
}

addBtn.addEventListener('click', addContact);
loadContacts();
</script>
</body>
</html>
