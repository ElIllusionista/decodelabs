<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — DecodeLabs Task API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-base: #1c130d;
    --wood-panel: #2a1d14;
    --wood-panel-raised: #362619;
    --wood-line: #4a3728;
    --brass: #c9a15a;
    --brass-bright: #e0bd7a;
    --leather: #8a6d4f;
    --cream: #ece1cd;
    --cream-dim: #b8a98f;
    --danger: #b5654a;
    --done-green: #7a9a72;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #251a12 0%, var(--wood-base) 55%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 40px);
    background-attachment: fixed;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 56px) 16px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 620px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: clamp(22px, 4vw, 34px);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(155deg, var(--brass-bright), var(--brass) 60%, #9c7a3d);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--wood-base);
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(22px, 4.5vw, 28px);
    margin: 0;
    letter-spacing: 0.2px;
  }

  .tagline {
    font-size: 12px;
    color: var(--cream-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .status-pill {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid var(--wood-line);
    color: var(--cream-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--done-green);
    box-shadow: 0 0 6px var(--done-green);
  }
  .status-dot.off { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  /* Add-item panel */
  .panel {
    background: linear-gradient(160deg, var(--wood-panel-raised), var(--wood-panel));
    border: 1px solid var(--wood-line);
    border-radius: var(--radius-lg);
    padding: clamp(14px, 3vw, 20px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
    margin-bottom: 22px;
  }

  .add-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    background: var(--wood-base);
    border: 1px solid var(--wood-line);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 13px 16px;
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="text"]::placeholder { color: #6b5a46; }
  input[type="text"]:focus {
    border-color: var(--brass);
    box-shadow: 0 0 0 3px rgba(201,161,90,0.18);
  }

  button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-md);
  }

  .btn-add {
    background: linear-gradient(155deg, var(--brass-bright), var(--brass));
    color: #241a0f;
    font-weight: 700;
    font-size: 15px;
    padding: 0 22px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }
  .btn-add:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,0.4); }
  .btn-add:active { transform: translateY(0); }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    padding-left: 2px;
    min-height: 16px;
  }

  /* List */
  .list-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--cream-dim);
    margin: 4px 6px 12px;
  }

  .items {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item {
    background: var(--wood-panel);
    border: 1px solid var(--wood-line);
    border-radius: var(--radius-md);
    padding: 14px 14px 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    transition: border-color 0.2s, background 0.2s, opacity 0.3s, transform 0.3s;
  }

  .item::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 3px;
    background: var(--brass);
    opacity: 0.55;
  }
  .item.done::before { background: var(--done-green); }

  .item.removing { opacity: 0; transform: translateX(12px) scale(0.98); }
  .item.entering { animation: dropIn 0.35s ease; }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .check {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 1.5px solid var(--leather);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .check.checked {
    background: var(--done-green);
    border-color: var(--done-green);
  }
  .check svg { width: 14px; height: 14px; opacity: 0; transition: opacity 0.15s; }
  .check.checked svg { opacity: 1; }

  .item-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    word-break: break-word;
    transition: color 0.2s;
  }
  .item.done .item-name {
    color: var(--cream-dim);
    text-decoration: line-through;
    text-decoration-color: var(--leather);
  }

  .item-id {
    font-family: 'Fraunces', serif;
    font-size: 11px;
    color: #6b5a46;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--cream-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--cream); }
  .icon-btn.delete:hover { background: rgba(181,101,74,0.18); color: var(--danger); }
  .icon-btn svg { width: 16px; height: 16px; }

  .edit-input {
    flex: 1;
    background: var(--wood-base);
    border: 1px solid var(--brass);
    color: var(--cream);
    font-size: 15px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    outline: none;
    min-width: 0;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--cream-dim);
  }
  .empty-state .glyph {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    color: var(--brass);
    opacity: 0.5;
    margin-bottom: 10px;
  }
  .empty-state p { margin: 0; font-size: 13.5px; }

  footer {
    text-align: center;
    margin-top: 34px;
    font-size: 11.5px;
    color: #6b5a46;
    letter-spacing: 0.04em;
  }

  @media (max-width: 380px) {
    .add-row { flex-direction: column; }
    .btn-add { padding: 13px; width: 100%; }
    .item-id { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  ::selection {
    background: var(--brass);
    color: var(--wood-base);
  }
  ::-moz-selection {
    background: var(--brass);
    color: var(--wood-base);
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">DL</div>
      <div>
        <h1>Ledger</h1>
        <div class="tagline">DecodeLabs Task API</div>
      </div>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </header>

  <div class="panel">
    <div class="add-row">
      <input type="text" id="newItemInput" placeholder="Add a new entry…" maxlength="120" />
      <button class="btn-add" id="addBtn">Add</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="list-label">
    <span>Entries</span>
    <span id="countLabel">—</span>
  </div>

  <div class="items" id="itemsList"></div>

  <footer>Backed by a local Express API · GET / POST / PUT / DELETE</footer>
</div>

<script>
const API_URL = 'http://localhost:3000';

const itemsList = document.getElementById('itemsList');
const newItemInput = document.getElementById('newItemInput');
const addBtn = document.getElementById('addBtn');
const errorMsg = document.getElementById('errorMsg');
const countLabel = document.getElementById('countLabel');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

function setConnectionStatus(ok) {
  statusDot.classList.toggle('off', !ok);
  statusText.textContent = ok ? 'API connected' : 'API offline';
}

function showError(msg) {
  errorMsg.textContent = msg || '';
}

const checkIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="#1c130d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
const editIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
const trashIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>`;

function renderItems(items) {
  itemsList.innerHTML = '';
  countLabel.textContent = items.length + (items.length === 1 ? ' item' : ' items');

  if (items.length === 0) {
    itemsList.innerHTML = `
      <div class="empty-state">
        <div class="glyph">—</div>
        <p>Nothing on the shelf yet. Add your first entry above.</p>
      </div>`;
    return;
  }

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item entering' + (item.done ? ' done' : '');
    row.dataset.id = item.id;

    row.innerHTML = `
      <button class="check ${item.done ? 'checked' : ''}" title="Toggle done">${checkIconSvg}</button>
      <span class="item-name">${escapeHtml(item.name)}</span>
      <span class="item-id">#${item.id}</span>
      <button class="icon-btn edit" title="Edit">${editIconSvg}</button>
      <button class="icon-btn delete" title="Delete">${trashIconSvg}</button>
    `;

    row.querySelector('.check').addEventListener('click', () => toggleDone(item));
    row.querySelector('.edit').addEventListener('click', () => startEdit(row, item));
    row.querySelector('.delete').addEventListener('click', () => deleteItem(row, item.id));

    itemsList.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadItems() {
  try {
    const res = await fetch(`${API_URL}/items`);
    if (!res.ok) throw new Error('Failed to load');
    const items = await res.json();
    setConnectionStatus(true);
    renderItems(items);
  } catch (err) {
    setConnectionStatus(false);
    itemsList.innerHTML = `<div class="empty-state"><div class="glyph">!</div><p>Can't reach the API. Is your server running on port 3000?</p></div>`;
  }
}

async function addItem() {
  const name = newItemInput.value.trim();
  showError('');
  if (!name) {
    showError('Please enter a name before adding.');
    return;
  }

  addBtn.disabled = true;
  try {
    const res = await fetch(`${API_URL}/items`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || 'Something went wrong.');
      return;
    }
    newItemInput.value = '';
    await loadItems();
  } catch (err) {
    showError('Could not reach the API.');
  } finally {
    addBtn.disabled = false;
  }
}

async function toggleDone(item) {
  try {
    const res = await fetch(`${API_URL}/items/${item.id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: !item.done })
    });
    if (!res.ok) throw new Error();
    await loadItems();
  } catch (err) {
    showError('Could not update item.');
  }
}

function startEdit(row, item) {
  const nameSpan = row.querySelector('.item-name');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'edit-input';
  input.value = item.name;
  nameSpan.replaceWith(input);
  input.focus();
  input.select();

  const commit = async () => {
    const newName = input.value.trim();
    if (newName && newName !== item.name) {
      try {
        const res = await fetch(`${API_URL}/items/${item.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName })
        });
        if (!res.ok) {
          const data = await res.json();
          showError(data.error || 'Could not update item.');
        }
      } catch (err) {
        showError('Could not reach the API.');
      }
    }
    loadItems();
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = item.name; input.blur(); }
  });
  input.addEventListener('blur', commit);
}

async function deleteItem(row, id) {
  row.classList.add('removing');
  try {
    const res = await fetch(`${API_URL}/items/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    setTimeout(loadItems, 250);
  } catch (err) {
    showError('Could not delete item.');
    row.classList.remove('removing');
  }
}

addBtn.addEventListener('click', addItem);
newItemInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
});

loadItems();
</script>
</body>
</html>
